<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QUEEN LEXIE V4</title>

    <meta name="description"
          content="QUEEN LEXIE V4 secure pairing service">

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <canvas id="matrix"></canvas>

    <main class="container">

        <section class="card">

            <!-- BOT STATUS -->
            <div class="status">
                <span id="statusDot"></span>
                <span id="statusText">CHECKING...</span>
            </div>

            <!-- BRAND -->
            <div class="brand">
                <div class="crown">♛</div>

                <h1>
                    QUEEN <span>LEXIE</span>
                </h1>

                <p>V4 PAIRING SYSTEM</p>
            </div>

            <div class="line"></div>

            <p class="description">
                Connect your WhatsApp account with
                <strong>QUEEN LEXIE V4</strong>.
            </p>

            <!-- PHONE -->
            <div class="input-group">

                <label for="phoneNumber">
                    PHONE NUMBER
                </label>

                <input
                    id="phoneNumber"
                    type="tel"
                    placeholder="Enter phone number"
                    autocomplete="off"
                >

            </div>

            <!-- GENERATE -->
            <button
                id="generateBtn"
                class="generate-btn"
                type="button"
            >
                ⚡ GENERATE PAIRING CODE
            </button>

            <!-- MESSAGE -->
            <div
                id="message"
                class="message"
                aria-live="polite"
            ></div>

            <!-- PAIRING RESULT -->
            <div
                id="pairingBox"
                class="pairing-box"
            >

                <small>PAIRING CODE</small>

                <div id="pairingCode">
                    ----
                </div>

                <button
                    id="copyBtn"
                    class="copy-btn"
                    type="button"
                >
                    COPY CODE
                </button>

            </div>

            <!-- INFO -->
            <div class="info">

                <div>
                    <span>BOT</span>
                    <strong>QUEEN LEXIE V4</strong>
                </div>

                <div>
                    <span>STATUS</span>
                    <strong id="infoStatus">Checking...</strong>
                </div>

                <div>
                    <span>DEVELOPER</span>
                    <strong>ZIGALY XR</strong>
                </div>

            </div>

        </section>

        <div class="zigaly">
            <span>ZIGALY XR</span>
        </div>

        <footer>
            QUEEN LEXIE V4 • DEVELOPED BY ZIGALY XR
        </footer>

    </main>

    <script src="/script.js"></script>

</body>
                </html>
