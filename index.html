<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QUEEN LEXIE V4 | Pairing</title>

    <meta name="description"
          content="QUEEN LEXIE V4 WhatsApp Bot Pairing Website - Developed by ZIGALY XR">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Matrix Background -->
    <canvas id="matrix"></canvas>

    <!-- Main Content -->
    <main class="container">

        <div class="card">

            <div class="status">
                <span id="statusDot"></span>
                <span id="statusText">CHECKING BOT...</span>
            </div>

            <div class="logo">
                <div class="crown">♛</div>
                <h1>QUEEN <span>LEXIE</span></h1>
                <p class="version">V4 PAIRING SYSTEM</p>
            </div>

            <div class="divider"></div>

            <p class="description">
                Connect your WhatsApp account to
                <strong>QUEEN LEXIE V4</strong>.
            </p>

            <div class="input-box">
                <input
                    type="text"
                    id="phoneNumber"
                    placeholder="Enter phone number"
                    autocomplete="off"
                >
            </div>

            <button id="generateBtn" class="generate-btn">
                <span>⚡</span>
                GENERATE PAIRING CODE
            </button>

            <div id="message" class="message"></div>

            <div class="pairing-box" id="pairingBox">
                <p>PAIRING CODE</p>
                <div id="pairingCode">----</div>
            </div>

            <div class="info">
                <div>
                    <span>BOT</span>
                    <strong>QUEEN LEXIE V4</strong>
                </div>

                <div>
                    <span>SERVER</span>
                    <strong>PAIR.XWOLF.SPACE</strong>
                </div>

                <div>
                    <span>DEVELOPER</span>
                    <strong>ZIGALY XR</strong>
                </div>
            </div>

        </div>

        <!-- Highlighted Developer Text -->
        <div class="zigaly">
            <span>ZIGALY XR</span>
        </div>

        <footer>
            QUEEN LEXIE V4 • Developed by ZIGALY XR
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
